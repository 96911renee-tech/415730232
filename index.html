<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />

    <!-- 設定響應式視窗 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- 設定網頁標題 -->
    <title>隨機數學題測驗</title>

    <!-- 預先連線至 Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- 預先連線至 Google Fonts 字型伺服器 -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- 載入 Noto Serif TC 與 Libre Caslon Condensed -->
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Condensed&family=Noto+Serif+TC:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- 載入 p5.js -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.min.js"></script>

    <!-- 設定網頁樣式 -->
    <style>
      /* 讓所有元素使用統一盒模型 */
      * {
        box-sizing: border-box;
      }

      /* 設定網頁與視窗大小一致 */
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #e5e5e5;
      }

      /* 設定網頁預設中文字型 */
      body {
        font-family: "Noto Serif TC", serif;
      }

      /* 讓畫布以區塊方式顯示 */
      canvas {
        display: block;
      }

      /* 避免手機點擊按鈕時出現高亮 */
      button {
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>

  <body>
    <!-- 載入 p5.js 主程式 -->
    <script src="sketch.js"></script>
  </body>
</html>
